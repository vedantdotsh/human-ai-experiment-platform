services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: experiment
      POSTGRES_DB: experiment
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment -d experiment"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://experiment:experiment@db:5432/experiment
      CONFIG_PATH: /srv/config.yml
      # Read from the git-ignored .env next to this file; empty means scripted AI only.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - ./config.yml:/srv/config.yml:ro
    depends_on:
      db:
        condition: service_healthy
    # No published ports: reachable only inside the Compose network.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
