# Experiment condition and timings. Read once at backend startup.
# Allowed human/AI mixes: 2 humans + 1 AI (default), 3 humans + 0 AI, 1 human + 2 AI.
# After editing, recreate the backend so it re-reads the file:
#   docker compose up -d --force-recreate backend
humans: 2
ai: 1
chat_seconds: 60
vote_seconds: 20
# Once every human is present, wait a random time in this range before starting.
start_delay_min_seconds: 3
start_delay_max_seconds: 8
# How long a waiting-room seat survives a closed socket (lets a refresh reconnect).
waiting_grace_seconds: 5
# AI players: model used when MISTRAL_API_KEY is set, and how long one call may take
# before the scripted fallback is used. Never sent to browsers.
ai_model: mistral-small-latest
ai_call_timeout_seconds: 8
